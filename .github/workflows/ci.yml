name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Java contracts and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify real consumer and provider, formatting and PMD
        run: ./mvnw -B -ntp clean verify
      - name: Validate account-operation guards
        run: bash scripts/test-pactflow-guards.sh
      - name: Prove a breaking provider fails verification
        run: bash scripts/check-breaking-change.sh
      - name: Check all maintained source and configuration files
        run: |
          python3 -m venv "$RUNNER_TEMP/hooks"
          "$RUNNER_TEMP/hooks/bin/pip" install pre-commit==4.7.0
          "$RUNNER_TEMP/hooks/bin/pre-commit" run --all-files --show-diff-on-failure
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Archive local reports and generated contracts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contract-reports
          retention-days: 3
          path: |
            **/target/surefire-reports/
            **/target/pacts/
            **/target/pmd.xml
